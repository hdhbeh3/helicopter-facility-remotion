name: Helicopter Facility - Full Video Render

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip ffmpeg libnss3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q helicopter-facility-project.zip -d extracted
          test -f extracted/heli/src/Root.tsx

      - name: Install project dependencies
        working-directory: extracted/heli
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Ensure Remotion browser
        working-directory: extracted/heli
        run: npx remotion browser ensure

      - name: Verify composition
        working-directory: extracted/heli
        run: npx remotion compositions src/index.ts

      - name: Render FULL video
        working-directory: extracted/heli
        run: |
          mkdir -p out
          npx remotion render src/index.ts HelicopterFacility \
            out/helicopter-facility.mp4 \
            --concurrency=2 \
            --gl=angle \
            --crf=20

      - name: Check final video
        working-directory: extracted/heli
        run: |
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            out/helicopter-facility.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: helicopter-facility-FULL-VIDEO
          path: extracted/heli/out/helicopter-facility.mp4
          if-no-files-found: error
          retention-days: 7
          

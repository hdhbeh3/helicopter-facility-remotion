name: Helicopter Render - Performance Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip ffmpeg libnss3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q helicopter-facility-project.zip -d extracted

          if [ ! -f extracted/heli/package.json ]; then
            echo "::error::Project package.json not found."
            exit 1
          fi

      - name: Install project dependencies
        working-directory: extracted/heli
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Ensure Remotion browser
        working-directory: extracted/heli
        run: npx remotion browser ensure

      - name: Diagnose composition ID
        working-directory: extracted/heli
        run: |
          echo "===== ROOT.TSX ====="
          cat src/Root.tsx

          echo "===== AVAILABLE COMPOSITIONS ====="
          npx remotion compositions src/index.ts

      - name: Render 3-second test
        working-directory: extracted/heli
        run: |
          mkdir -p out

          npx remotion render src/index.ts "Helicopter Facility" \
            out/preview-test.mp4 \
            --scale=0.5 \
            --crf=26 \
            --concurrency=2 \
            --gl=angle \
            --frames=0-89

      - name: Check video
        working-directory: extracted/heli
        run: |
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            out/preview-test.mp4

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: helicopter-3-second-test
          path: extracted/heli/out/preview-test.mp4
          if-no-files-found: error
          retention-days: 7
          

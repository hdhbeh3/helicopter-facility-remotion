name: Helicopter Facility - Optimized Render

on:
  workflow_dispatch:
    inputs:
      quality:
        description: Select render mode
        type: choice
        required: true
        default: benchmark
        options:
          - benchmark
          - preview
          - full

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            unzip \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libgbm1 \
            libasound2t64 \
            libxrandr2 \
            libxkbcommon0 \
            libxfixes3 \
            libxcomposite1 \
            libxdamage1 \
            libcups2 \
            libpango-1.0-0 \
            libcairo2

      - name: Extract optimized project ZIP
        run: |
          test -f helicopter-facility-project.zip
          rm -rf extracted
          mkdir -p extracted
          unzip -q helicopter-facility-project.zip -d extracted
          test -f extracted/heli/package.json
          echo "Project ZIP extracted successfully."

      - name: Install project dependencies
        working-directory: extracted/heli
        run: npm install --no-audit --no-fund

      - name: Run project checks
        working-directory: extracted/heli
        run: npm run check

      - name: TypeScript check
        working-directory: extracted/heli
        run: npm run typecheck
        continue-on-error: true

      - name: Ensure Remotion browser
        working-directory: extracted/heli
        run: npx remotion browser ensure

      - name: Render selected mode
        working-directory: extracted/heli
        env:
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          mkdir -p out

          if [ "$QUALITY" = "benchmark" ]; then
            echo "Rendering first 3 seconds at full resolution..."
            npx remotion render \
              src/index.ts HelicopterFacility \
              out/helicopter-benchmark-3s.mp4 \
              --frames=0-89 \
              --codec=h264 \
              --crf=18 \
              --pixel-format=yuv420p \
              --concurrency=1 \
              --gl=swangle \
              --timeout=120000 \
              --audio-codec=aac \
              --audio-bitrate=256k \
              --overwrite

          elif [ "$QUALITY" = "preview" ]; then
            echo "Rendering full video at half resolution..."
            npx remotion render \
              src/index.ts HelicopterFacility \
              out/helicopter-facility-preview.mp4 \
              --scale=0.5 \
              --crf=26 \
              --concurrency=1 \
              --gl=swangle \
              --timeout=120000 \
              --overwrite

          elif [ "$QUALITY" = "full" ]; then
            echo "Rendering complete final video..."
            npx remotion render \
              src/index.ts HelicopterFacility \
              out/helicopter-facility.mp4 \
              --codec=h264 \
              --crf=18 \
              --pixel-format=yuv420p \
              --concurrency=1 \
              --gl=swangle \
              --timeout=120000 \
              --audio-codec=aac \
              --audio-bitrate=256k \
              --overwrite
          else
            echo "Unknown quality mode"
            exit 1
          fi

      - name: Verify rendered video
        working-directory: extracted/heli
        run: |
          echo "Checking output video..."
          find out -maxdepth 1 -name '*.mp4' -type f -print

          for file in out/*.mp4; do
            test -f "$file" || continue
            ffprobe -v error \
              -show_entries format=duration \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -of default=noprint_wrappers=1 "$file"
          done

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: helicopter-facility-${{ github.event.inputs.quality }}
          path: extracted/heli/out/*.mp4
          if-no-files-found: error
          retention-days: 7

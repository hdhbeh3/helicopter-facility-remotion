
name: Diagnose Helicopter Render Performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q helicopter-facility-project.zip -d extracted

          echo "===== PROJECT FILES ====="
          find extracted -maxdepth 4 -type f | sort | head -250

      - name: Inspect package and Remotion settings
        run: |
          echo "===== PACKAGE.JSON FILES ====="

          while IFS= read -r file; do
            echo "----- $file -----"

            node -e "
              const p = require('./$file');
              console.log(JSON.stringify({
                name: p.name,
                scripts: p.scripts,
                dependencies: p.dependencies,
                devDependencies: p.devDependencies
              }, null, 2));
            "
          done < <(find extracted -name package.json -not -path '*/node_modules/*' -print)

          echo "===== REMOTION CONFIGURATION FILES ====="

          find extracted -type f \
            \( -iname '*remotion*config*' \
            -o -name 'Root.tsx' \
            -o -name 'index.ts' \
            -o -name 'Video.tsx' \
            -o -name 'timeline.ts' \) \
            -not -path '*/node_modules/*' -print

          echo "===== RENDER SETTINGS REFERENCES ====="

          grep -RIn \
            --exclude-dir=node_modules \
            --exclude='*.map' \
            -E 'remotion render|concurrency|composition|durationInFrames|1080|1920' \
            extracted 2>/dev/null | head -250 || true

      - name: Inspect GitHub runner resources
        run: |
          echo "===== CPU ====="
          nproc
          lscpu

          echo "===== MEMORY ====="
          free -h

          echo "===== DISK ====="
          df -h .

          echo "===== GPU ====="
          (lspci | grep -Ei 'vga|3d|display' || true)

          echo "===== BROWSER ====="
          (which chromium || which chromium-browser || true)

      - name: Diagnostic complete
        run: echo "Diagnostic completed. No video was rendered."
        
